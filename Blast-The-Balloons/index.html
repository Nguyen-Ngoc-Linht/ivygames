<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
	<title>Blast The Balloons</title>
	
	<!-- Standardised web app manifest -->
	<link rel="manifest" href="appmanifest.json" />
	
	<!-- Allow fullscreen mode on iOS devices. (These are Apple specific meta tags.) -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black" />
	<link rel="apple-touch-icon" sizes="256x256" href="icon-256.png" />
	<meta name="HandheldFriendly" content="true" />
	
	<!-- Chrome for Android web app tags -->
	<meta name="mobile-web-app-capable" content="yes" />
	<link rel="shortcut icon" sizes="256x256" href="icon-256.png" />

    <!-- All margins and padding must be zero for the canvas to fill the screen. -->
	<style type="text/css">
		* {
			padding: 0;
			margin: 0;
		}
		html, body {
			background: #000;
			color: #fff;
			overflow: hidden;
			touch-action: none;
			-ms-touch-action: none;
		}
		canvas {
			touch-action-delay: none;
			touch-action: none;
			-ms-touch-action: none;
		}
    </style>
	
	<link href="animate.min.css" rel="stylesheet" type="text/css" />

</head> 
 
<body> 
	<div id="fb-root"></div>
	
	<script>
	// Issue a warning if trying to preview an exported project on disk.
	(function(){
		// Check for running exported on file protocol
		if (window.location.protocol.substr(0, 4) === "file")
		{
			alert("Exported games won't work until you upload them. (When running on the file:/// protocol, browsers block many features from working for security reasons.)");
		}
	})();
	</script>
	
	<!-- The canvas must be inside a div called c2canvasdiv -->
	<div id="c2canvasdiv">
	
		<!-- The canvas the project will render to.  If you change its ID, don't forget to change the
		ID the runtime looks for in the jQuery events above (ready() and cr_sizeCanvas()). -->
		<canvas id="c2canvas" width="480" height="854">
			<!-- This text is displayed if the visitor's browser does not support HTML5.
			You can change it, but it is a good idea to link to a description of a browser
			and provide some links to download some popular HTML5-compatible browsers. -->
			<h1>Your browser does not appear to support HTML5.  Try upgrading your browser to the latest version.  <a href="http://www.whatbrowser.org">What is a browser?</a>
			<br/><br/><a href="http://www.microsoft.com/windows/internet-explorer/default.aspx">Microsoft Internet Explorer</a><br/>
			<a href="http://www.mozilla.com/firefox/">Mozilla Firefox</a><br/>
			<a href="http://www.google.com/chrome/">Google Chrome</a><br/>
			<a href="http://www.apple.com/safari/download/">Apple Safari</a></h1>
		</canvas>
		
	</div>
	
	<!-- Pages load faster with scripts at the bottom -->
	
	<!-- Construct 2 exported games require jQuery. -->
	<script src="jquery-3.4.1.min.js"></script>


	
    <!-- The runtime script.  You can rename it, but don't forget to rename the reference here as well.
    This file will have been minified and obfuscated if you enabled "Minify script" during export. -->
	<script src="c2runtime.js"></script>

    <script>
		// Start the Construct 2 project running on window load.
		jQuery(document).ready(function ()
		{			
			// Create new runtime using the c2canvas
			window.c2RuntimeObjGlobal = cr_createRuntime("c2canvas");
		});
		
		// Pause and resume on page becoming visible/invisible
		function onVisibilityChanged() {
			if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)
				cr_setSuspended(true);
			else
				cr_setSuspended(false);
		};
		
		document.addEventListener("visibilitychange", onVisibilityChanged, false);
		document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("msvisibilitychange", onVisibilityChanged, false);
		
		function OnRegisterSWError(e)
		{
			console.warn("Failed to register service worker: ", e);
		};
		
		// Runtime calls this global method when ready to start caching (i.e. after startup).
		// This registers the service worker which caches resources for offline support.
		window.C2_RegisterSW = function C2_RegisterSW()
		{
			if (!navigator.serviceWorker)
				return;		// no SW support, ignore call
			
			try {
				navigator.serviceWorker.register("sw.js", { scope: "./" })
				.then(function (reg)
				{
					console.log("Registered service worker on " + reg.scope);
				})
				.catch(OnRegisterSWError);
			}
			catch (e)
			{
				OnRegisterSWError(e);
			}
		};
    </script>
    
    <!-- START CUSTOME GAME SESSION TRACKING -->
    <script>
        var isGameSessionActive = false;
        var c2RuntimeObj = null;

        // Export ra một biến Global (window object) để có thể gọi ở bất cứ đâu trong console (F12)
        window.GameTrackingData = {
            history: [],
            currentTurn: null
        };

        // Construct 2 lưu các biến Global trong một mảng của runtime. 
        // Bằng cách map array variables từ cấu trúc của Construct, ta có thể tìm theo tên
        function getConstruct2VarByName(runtime, name) {
            try {
                // Thường Construct 2 lưu biến global trong runtime.all_global_vars 
                if (runtime.all_global_vars) {
                    for (var i = 0; i < runtime.all_global_vars.length; i++) {
                        // All_global_vars là mảng các ob, property có tên biến (chưa minified)
                        if (runtime.all_global_vars[i].name === name) {
                            return runtime.all_global_vars[i].data;
                        }
                    }
                }
            } catch (e) {
                console.warn("[TRACKING] Lỗi khi lấy biến " + name, e);
            }
            return null;
        }

        // Tạo vòng lặp để lắng nghe trạng thái của game
        var debugCount = 0;
        setInterval(function() {
            // Lấy object Runtime của C2 (đã được lưu khi khởi tạo)
            if (!c2RuntimeObj) {
                if (window.c2RuntimeObjGlobal) {
                    c2RuntimeObj = window.c2RuntimeObjGlobal;
                    console.log("[TRACKING DEBUG] Đã gắn thành công c2RuntimeObj qua cr_createRuntime.");
                } else if (window.jQuery && jQuery("#c2canvas").data("c2runtime")) {
                    c2RuntimeObj = jQuery("#c2canvas").data("c2runtime");
                    console.log("[TRACKING DEBUG] Đã gắn thành công c2RuntimeObj qua jQuery.");
                } else if (typeof cr_getC2Runtime !== 'undefined') {
                    c2RuntimeObj = cr_getC2Runtime();
                    console.log("[TRACKING DEBUG] Đã gắn thành công c2RuntimeObj qua cr_getC2Runtime.");
                }
            }

            if (debugCount < 5) {
                console.log("[TRACKING DEBUG] Tick. c2RuntimeObj có tốn tại không? " + (c2RuntimeObj ? "CÓ" : "KHÔNG"));
                if (c2RuntimeObj) {
                    console.log("[TRACKING DEBUG] c2RuntimeObj.running_layout tốn tại không? ", !!c2RuntimeObj.running_layout);
                    if (c2RuntimeObj.running_layout) {
                        console.log("[TRACKING DEBUG] Tên layout hiện tại: ", c2RuntimeObj.running_layout.name);
                    }
                }
                debugCount++;
            }

            // Nếu lấy được Runtime, bắt đầu check sự kiện
            if (c2RuntimeObj && c2RuntimeObj.running_layout) {
                var currentLayout = c2RuntimeObj.running_layout.name;
                
                // Màn hình Game => Bắt đầu
                if (currentLayout === "Game" || currentLayout === "Start") {
                    if (currentLayout === "Game" && !isGameSessionActive) {
                        isGameSessionActive = true;
                        
                        // Lưu data vào biến theo dõi của lượt chơi mới
                        window.GameTrackingData.currentTurn = {
                            status: "PLAYING",
                            startTime: new Date(),
                            endTime: null,
                            score: 0,
                            bestScore: 0
                        };

                        console.log("==========================================");
                        console.log("[TRACKING EVENT] GAME BẮT ĐẦU...", window.GameTrackingData.currentTurn);
                        console.log("\t+ Thời gian: " + window.GameTrackingData.currentTurn.startTime.toLocaleTimeString());
                        console.log("\t+ Vị trí kích hoạt: Màn hình Game");
                        console.log("==========================================");
                    }
                } 
                // Màn hình Score => Chết / Game Over => Kết thúc
                else if (currentLayout === "Score" && isGameSessionActive) {
                    isGameSessionActive = false;
                    
                    var score = getConstruct2VarByName(c2RuntimeObj, "Score");
                    var bestScore = getConstruct2VarByName(c2RuntimeObj, "BestScore");
                    var miss = getConstruct2VarByName(c2RuntimeObj, "Miss");
                    
                    // Cập nhật thông tin điểm số, thời gian kết thúc của lượt chơi
                    if (window.GameTrackingData.currentTurn) {
                        window.GameTrackingData.currentTurn.status = "GAME_OVER";
                        window.GameTrackingData.currentTurn.endTime = new Date();
                        window.GameTrackingData.currentTurn.score = score;
                        window.GameTrackingData.currentTurn.bestScore = bestScore;
                        window.GameTrackingData.currentTurn.misses = miss;
                        // Đẩy lượt chơi vừa xong vào lịch sử
                        window.GameTrackingData.history.push(window.GameTrackingData.currentTurn);
                    }
                    
                    console.log("==========================================");
                    console.log("[TRACKING EVENT] GAME KẾT THÚC!", window.GameTrackingData.currentTurn);
                    console.log("\t+ Thời gian: " + new Date().toLocaleTimeString());
                    console.log("\t+ Điểm số (Score):", score);
                    if (bestScore !== null) console.log("\t+ Best Score:", bestScore);
                    console.log("👉 [GỢI Ý] Để lấy tất cả dữ liệu, gõ 'GameTrackingData' trên Console F12");
                    console.log("==========================================");
                }
            }
        }, 500); // Set tốc độ lấy mẫu là 500ms
    </script>
    <!-- END CUSTOME GAME SESSION TRACKING -->

</body>  
</html>
